[runtime]
sampler = emcee #test for a single-eval sanity check
root = ${PWD}
resume = F
verbosity = debug #quiet
 
[test]
save_dir = output/test/hmf_alpha_v1
fatal_errors = T
 
[emcee]
walkers = 32               ; bumped up further: ndim=4 now (omega_m, sigma8_input, frac_scatter, gamma_scatter)
samples = 3000              ; benchmark first -- see chat notes on timing this within 8h
#burn = 600 #do this in post-processing
#save_all_parameters = F
#output_every = 10
#proposal_scale = 1.0
 
#[maxlike] this can be used if we are doing a maxlike sampler not a emcee, if we want to find the quick best-fit without sampling, ask xin about it
#output_ini = mf_xt/output/mf_manual_v1.ini
#tolerance = 1e-6
 
[output]
filename = output/scatter_gt30_free_gamma_frac.txt
format = text
lock = F
new_file = T
 
[pipeline]
modules = mass_function_like
values = configs/values.ini
likelihoods = hmf
;priors = configs/priors.ini
timing = T
 
;cosmosis not read this at all
;[prior]
;omega_m = uniform 0.1 0.5
;sigma8_input = uniform 0.6 1.0
;mor_parameters/frac_scatter = normal 0.20 0.05
 
[mass_function_like]
file = likelihoods/hmf_mor_forecast.py
 
; redshift range + binning (typical X-ray cluster survey depth/cadence)
z_min      = 0.1
z_max      = 1.0
n_z_bins   = 9
area_deg2  = 4000.0
 
; mass range + binning (Msun/h)
mass_min    = 2e14
mass_max    = 5e15
n_mass_bins = 10
 
; fiducial (mock only)
Om0_fid    = 0.318
sigma8_fid = 0.80
h0_fid     = 0.7
 
; MOR knobs
alpha_MOR            = 1.0
; M_piv               = <default: geometric mean of mass_min/mass_max>   ; uncomment to override (Msun/h)
 
frac_scatter_data    = 0.20    ; TRUE scatter (sigma_lnO at M_piv) in the mock
gamma_scatter_data   = 0.30    ; TRUE mass-trend: sigma is genuinely OBSERVABLE-DEPENDENT
 
scatter_model_free  = T        ; frac_scatter is FIT -- read from mor_parameters.frac_scatter each step
frac_scatter_model  = 0.20     ; unused while scatter_model_free = T (kept for reference / fallback)
gamma_scatter_free  = T        ; gamma_scatter is ALSO FIT -- correctly-specified functional form,
gamma_scatter_model = 0.0      ; unused while gamma_scatter_free = T (kept for reference / fallback)
                                ; but its parameters (not fixed values) are now marginalized.
 
; Requires configs/values.ini to declare, e.g.:
;   [mor_parameters]
;   frac_scatter  = 0.02  0.20  0.50
;   gamma_scatter = -1.0  0.00  1.0
 
