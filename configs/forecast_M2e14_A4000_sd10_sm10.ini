[runtime]
sampler = emcee #maxlike #emcee
#likelihoods = mass_function_xt
root = ${PWD}
resume = F
verbosity = debug #quiet

#[test] ;this section is not been used by cosmosis 
#save_dir=mf_xt/output/test/hmf_counts_v1


[emcee]
walkers = 40
samples = 8000
#burn = 600 #do this in post-processing
#save_all_parameters = F
#output_every = 10
#proposal_scale = 1.0

#[maxlike] this can be used if we are doing a maxlike sampler not a emcee, if we want to find the quick best-fit without sampling, ask xin about it 
#output_ini = mf_xt/output/mf_manual_v3.ini
#tolerance = 1e-6

[output]
filename = output/v1.txt
format = text
lock = F
new_file = T

[pipeline]
modules = mass_function_like  
values = configs/values_fit_scatter_massde.ini
likelihoods = hmf
#priors = mf_xt/priors_fit.ini
timing = T

[prior]
omega_m = uniform 0.1 0.5
sigma8_input = uniform 0.6 1.0
sigma0  = uniform 0.05 0.4 ;v2: prior for nuisance parameter

[likelihoods]
mass_function_like = hmf

[mass_function_like]
file = likelihoods/hmf_mor_forecast.py

; redshift + survey
z_min      = 0.3
z_max      = 0.5
area_deg2  = 4000.0

; mass range + binning (Msun/h)
mass_min    = 2e14
mass_max    = 5e15
n_mass_bins = 10

; fiducial (mock only)
Om0_fid    = 0.318
sigma8_fid = 0.80

; MOR knobs
alpha_MOR            = 1.0
frac_scatter_data    = 0.10    ; TRUE scatter in the mock
frac_scatter_model   = 0.10    ; ASSUMED scatter in the fit
marginalise_scatter  = F       ; if T, frac_scatter is sampled instead